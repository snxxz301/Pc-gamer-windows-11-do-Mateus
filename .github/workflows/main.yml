name: RDP Windows

on:
  workflow_dispatch:

jobs:
  rdp:
    name: rdp
    runs-on: windows-2025
    timeout-minutes: 120

    steps:

      - name: Criar usuario RDP
        shell: powershell
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name $env:RDP_USER `
                -Password $secure `
                -PasswordNeverExpires `
                -UserMayNotChangePassword
          }

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Instalar Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest $url -OutFile "$env:TEMP\tailscale.exe"
          Start-Process "$env:TEMP\tailscale.exe" `
            -ArgumentList "/quiet" -Wait

      - name: Login Tailscale
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up

      - name: Mostrar IP
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Manter ligado
        shell: powershell
        run: |
          Start-Sleep -Seconds 7200
