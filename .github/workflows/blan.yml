name: Testes GUI - Windows

on:
  workflow_dispatch:
  push:

jobs:
  gui-tests:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar Windows
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pywinauto

      - name: Executar aplicação
        shell: pwsh
        run: |
          Start-Process ".\MinhaAplicacao.exe"
          Start-Sleep -Seconds 5

      - name: Executar testes GUI
        shell: pwsh
        run: |
          pytest tests/gui -v

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-gui
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
